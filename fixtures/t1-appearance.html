<!doctype html><html><head><meta charset="utf-8"><title>T1 appearance</title>
<style>
  body{margin:0;font-family:system-ui;background:#f7f8fa;color:#111;}
  section{min-height:600px;padding:60px 40px;border-bottom:1px solid #eee;}
  h1{font-size:36px;margin:0 0 12px;}
  .fade{opacity:0;transform:translateY(30px);transition:all .8s ease;}
  .fade.in{opacity:1;transform:none;}
  img{max-width:100%;display:block;background:#e0e4eb;height:200px;}
</style></head><body>
<section><h1>Hero</h1><p>스크롤 등장 데모</p></section>
<section><h1 class="fade">두 번째 섹션</h1><p class="fade">스크롤로 나타남 · 끝 상태 하나</p></section>
<section><h1 class="fade">세 번째 섹션</h1><p class="fade">IntersectionObserver 기반</p><img loading="lazy" src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='800' height='200'><rect width='800' height='200' fill='%23c8d0dc'/></svg>"/></section>
<section><h1 class="fade">네 번째 섹션</h1><p class="fade">끝 상태 명확</p></section>
<script>
  const io = new IntersectionObserver((entries) => {
    for (const e of entries) if (e.isIntersecting) e.target.classList.add('in');
  }, { threshold: 0.1 });
  document.querySelectorAll('.fade').forEach(el => io.observe(el));
</script>
</body></html>
